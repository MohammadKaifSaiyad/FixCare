# FixCare — local development stack.
#
# STUB: brings up the data services every backend feature needs (Postgres +
# PostGIS, Redis). The backend app service itself is added here when apps/backend
# is built (Months 1-2). Until then, `docker compose up` gives you a database and
# cache to develop against.
#
# Infrastructure rationale: docs/03-tech-stack/infrastructure.md
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fixcare
      POSTGRES_PASSWORD: fixcare_dev # dev only — never used in prod
      POSTGRES_DB: fixcare_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixcare -d fixcare_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # backend:
  #   build: ./apps/backend     # ← uncommented when apps/backend exists
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis:    { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
